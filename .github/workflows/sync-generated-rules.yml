name: Sync generated rules

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-generated-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest branch state
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt

      - name: Generate client rule files
        run: python3 tools/generate_rules.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify generated files
        run: python3 tools/generate_rules.py --check

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet -- Rules; then
            echo "Generated files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Rules
          git diff --cached --check
          git commit -m "chore: sync generated rules"
          git push origin "HEAD:${GITHUB_REF_NAME}"
