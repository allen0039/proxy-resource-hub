# === 4. Apple 通知与 iCloud 例外 ===
# Private Relay 必须先于 iCloud 全域直连。
host, mask.icloud.com, Apple
host, mask-h2.icloud.com, Apple
host, mask-api.icloud.com, Apple
host, mask-canary.icloud.com, Apple
host, mask.apple-dns.net, Apple
