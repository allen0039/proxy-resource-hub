[server_remote]
# 订阅使用说明：
# 1. [server_remote] 首字段为订阅 URL，请替换为自己的地址；enabled 控制该订阅是否加载。
# 2. update-interval=21600 表示每 6 小时更新；当前仅启用 拼好鸡；非原生格式才使用 opt-parser=true。
# 3. 替换 URL 时保留 tag 和其他参数；节点为空时检查订阅状态与 server-tag-regex。
获取到的订阅链接, tag=拼好鸡, update-interval=21600, opt-parser=false, enabled=true
获取到的订阅链接, tag=机场, update-interval=21600, opt-parser=false, enabled=false
获取到的订阅链接, tag=自建, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Alpha/Vpn.png, update-interval=21600, opt-parser=true, enabled=false
获取到的订阅链接, tag=备用, update-interval=21600, opt-parser=false, enabled=false

