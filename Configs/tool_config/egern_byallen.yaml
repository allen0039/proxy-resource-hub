      filter: '(?i)^(?!.*(家用|家庭|家宽|\bISP\b|🇭🇰|香港|(^|[^A-Za-z0-9])(HK|HKG|Hong([ _-]?Kong)?)([ _-]?\d+)?($|[^A-Za-z0-9])|🇹🇼|台湾|台北|(^|[^A-Za-z0-9])(TW|TWN|Tai|Taiwan)([ _-]?\d+)?($|[^A-Za-z0-9])|🇯🇵|日本|川日|东京|大阪|泉日|沪日|深日|埼玉|(^|[^A-Za-z0-9])(JP|JPN|Japan)([ _-]?\d+)?($|[^A-Za-z0-9])|🇸🇬|新加坡|狮城|(^|[^A-Za-z0-9])(SG|SGP|Singapore)([ _-]?\d+)?($|[^A-Za-z0-9])|🇺🇸|🇺🇲|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(^|[^A-Za-z0-9])(US|USA|United[ _-]?States|States)([ _-]?\d+)?($|[^A-Za-z0-9])|🇰🇷|韩国|韓|韓國|首尔|首爾|(^|[^A-Za-z0-9])(KR|KOR|Korea)([ _-]?\d+)?($|[^A-Za-z0-9])|🇬🇧|英国|倫敦|伦敦|(^|[^A-Za-z0-9])(UK|GB|GBR|United[ _-]?Kingdom)([ _-]?\d+)?($|[^A-Za-z0-9])|🇩🇪|德国|德國|法兰克福|法蘭克福|柏林|慕尼黑|(^|[^A-Za-z0-9])(DE|DEU|Germany|Deutschland|Frankfurt|Berlin|Munich)([ _-]?\d+)?($|[^A-Za-z0-9])|直连|回国|校园|游戏|🎮|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|交流群|官方群|用户群|群组|社群|群聊|贩卖|倒卖|防止|国内|(^|[^A-Za-z0-9])(GAME|USE|USED|TOTAL|EXPIRE|EMAIL|Panel)($|[^A-Za-z0-9])|\d{4}-\d{2}-\d{2})).+$'
      icon: map
  - select:
      name: 全部节点
      policies: [拼好鸡]
      flatten: true
      filter: '(?i)^(?!.*(邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|交流群|官方群|用户群|群组|社群|群聊|贩卖|倒卖|防止|国内|(^|[^A-Za-z0-9])(USE|USED|TOTAL|EXPIRE|EMAIL|Panel)($|[^A-Za-z0-9])|\d{4}-\d{2}-\d{2})).+$'
      icon: server.rack

rules:
  # 1. 与 Loon/Surge 对齐的最高优先级例外。
  - domain_suffix:
      name: mfallen 美国路由
      match: mfallen.de
      policy: 美国节点
  - domain_suffix:
      name: FlyAPI 美国路由
      match: api.flyapi.tech
      policy: 美国节点
  - domain_suffix:
      name: Apple Push 兜底
      match: push.apple.com
      policy: Apple Push
  - domain_suffix:
      name: Apple Relay
      match: apple-relay.apple.com
      policy: Apple
  - domain_suffix:
      name: GitHub Pages
      match: github.io
      policy: GitHub
  - domain_suffix:
      name: GitHub Assets
      match: githubassets.com
      policy: GitHub
  - domain:
      name: GitHub API
      match: api.github.com
      policy: GitHub
  - domain:
      name: Gemini 首页
      match: gemini.google.com
      policy: Google
  - domain:
      name: Adobe 授权放行
      match: lcs-cops.adobe.io
      policy: DIRECT
  - domain_suffix:
      name: Adobe IC 拦截
      match: ic.adobe.io
      policy: REJECT
  - domain_suffix:
      name: Adobe HStatic 拦截
      match: hstatic.io
      policy: REJECT
  - domain_suffix:
      name: Adobe Stats 拦截
      match: adobestats.io
      policy: REJECT
  - domain_suffix:
      name: Adobe IO 拦截
      match: adobe.io
      policy: REJECT
  - domain:
      name: 拦截 ntb.lanjie100
      match: ntb.lanjie100.com
      policy: REJECT
  - domain:
      name: 拦截农行检测
      match: msmp.abchina.com.cn
      policy: REJECT
  - ip_cidr:
      name: Loon 本地拒绝 IP
      match: 95.161.76.100/31
      policy: REJECT
      no_resolve: true
  - ip_cidr:
      name: Surge 本地拒绝 IP
      match: 180.76.76.200/32
      policy: REJECT
      no_resolve: true
  - ip_cidr:
      name: Surge 阿里 HTTPDNS 拒绝段
      match: 203.107.1.0/24
      policy: REJECT
      no_resolve: true
  - domain_suffix:
      name: YouTube 静态资源
      match: ytimg.com
      policy: YouTube
  - domain_suffix:
      name: Google Safe Browsing
      match: safebrowsing.google.com
      policy: Google

  # 测速通用规则：与 Loon 的 Blackmatrix 规则保持一致，并先于 Direct/CDN。
  - domain_suffix:
      name: Fast.com 测速
      match: fast.com
      policy: 测速
  - domain_suffix:
      name: Ookla 测速节点
      match: ooklaserver.net
      policy: 测速
  - domain_suffix:
      name: Cloudflare 测速
      match: speed.cloudflare.com
      policy: 测速
  - domain_suffix:
      name: Dler 测速
      match: speed.dler.io
      policy: 测速
  - domain_keyword:
      name: Speedtest 关键字
      match: speedtest
      policy: 测速

  # 2. Allen 自维护规则，仍需先发布 Rules/Egern 到 main 分支。
  - rule_set:
      name: 自定义直连
      match: https://raw.githubusercontent.com/allen0039/proxy-resource-hub/main/Rules/Egern/Custom/direct.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      name: 香港指定站点
      match: https://raw.githubusercontent.com/allen0039/proxy-resource-hub/main/Rules/Egern/Regional/hk.yaml
      policy: 香港节点
      update_interval: 86400
  - rule_set:
      name: 美国指定站点
      match: https://raw.githubusercontent.com/allen0039/proxy-resource-hub/main/Rules/Egern/Regional/us.yaml
      policy: 美国节点
      update_interval: 86400
  - rule_set:
      name: 日本指定站点
      match: https://raw.githubusercontent.com/allen0039/proxy-resource-hub/main/Rules/Egern/Regional/jp.yaml
      policy: 日本节点
      update_interval: 86400
  - rule_set:
      name: 新加坡指定站点
      match: https://raw.githubusercontent.com/allen0039/proxy-resource-hub/main/Rules/Egern/Regional/sg.yaml
      policy: 新加坡节点
      update_interval: 86400
