      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/OneDrive.yaml
      policy: OneDrive
      update_interval: 86400
  - rule_set:
      name: Microsoft
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Microsoft.yaml
      policy: Microsoft
      update_interval: 86400

  # 7. 通用 CDN、国外媒体和海淘，随后才进入国内/国外兜底。
  - rule_set:
      name: CDN
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/CDN.yaml
      policy: CDN
      update_interval: 86400
  - rule_set:
      name: 通用国外媒体
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/ProxyMedia.yaml
