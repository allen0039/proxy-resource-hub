# Allen 维护 - Egern 配置
# APNs 默认关闭：include_all_networks 和 include_apns 均为 false。
# 开启时将这两个字段改为 true；蜂窝与本地网络接管仍保持 false。
# 在 policy_groups 列表中加入以下策略组（删除示例行的 # 和紧随其后的空格）：
# - select:
#     name: Apple Push
#     policies:
#     - 香港节点
#     - 日本节点
#     - 美国节点
#     - DIRECT
# 然后将 rules 中 push.apple.com 的 policy 从 DIRECT 改为 Apple Push，
# 并在 rules 的通用 Apple 规则之前加入以下远程规则（不要放在 default 之后）：
# - rule_set:
#     match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/APNs.yaml
#     policy: Apple Push
# 重新加载配置后，在 Apple Push 组中手动选择出口。
ipv6: false
http_port: 8585
socks_port: 1235
allow_external_connections: false
vif_only: false
hide_vpn_icon: false
close_connections_on_policy_change: true
include_all_networks: false
include_apns: false
include_cellular_services: false
include_local_networks: false
hijack_dns:
- 8.8.8.8:53
- 8.8.4.4:53
proxy_latency_test_url: http://cp.cloudflare.com/generate_204
direct_latency_test_url: http://connectivitycheck.platform.hicloud.com/generate_204
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
vif_excluded_routes:
- 10.0.0.0/8
- 100.64.0.0/10
- 127.0.0.0/8
- 169.254.0.0/16
- 172.16.0.0/12
- 192.0.0.0/24
- 192.0.2.0/24
- 192.88.99.0/24
- 192.168.0.0/16
- 198.51.100.0/24
- 203.0.113.0/24
- 224.0.0.0/4
- 255.255.255.255/32
dns:
  bootstrap:
  - 223.5.5.5
  - 223.6.6.6
  upstreams:
    Plain-DNS:
    - 223.5.5.5
    - 223.6.6.6
  forward:
  - domain_wildcard:
      match: '*.lan'
      value: system
  - domain_wildcard:
      match: '*.local'
      value: system
  - domain_wildcard:
      match: router.asus.com
      value: system
  - domain_wildcard:
      match: www.miwifi.com
      value: system
  - domain_wildcard:
      match: miwifi.com
      value: system
  - domain_wildcard:
      match: router.synology.com
      value: system
  - domain_wildcard:
      match: tplogin.cn
      value: system
  - domain_wildcard:
      match: melogin.cn
      value: system
  - domain_wildcard:
      match: falogin.cn
      value: system
  - domain_wildcard:
      match: tplinklogin.net
      value: system
  - domain_wildcard:
      match: orbilogin.com
      value: system
  - domain_wildcard:
      match: routerlogin.net
      value: system
  - domain_wildcard:
      match: injections.adguard.org
      value: system
  - domain_wildcard:
      match: local.adguard.org
      value: system
  - domain_wildcard:
      match: '*.bogon'
      value: system
  - domain_wildcard:
      match: '*'
      value: Plain-DNS
  proxy_nameservers:
  - 223.5.5.5
  - 223.6.6.6
  skip_tls_verify: false
bypass_tunnel_proxy:
