      update_interval: 86400
  - rule_set:
      name: 游戏平台
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Game.yaml
      policy: 游戏平台
      update_interval: 86400
  - rule_set:
      name: PayPal
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/PayPal.yaml
      policy: PayPal
      update_interval: 86400
  # 6. Apple、Microsoft 等具体平台位于 CDN 前。
  - rule_set:
      name: Apple 中国服务
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/AppleCN.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      name: Apple
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Apple.yaml
      policy: Apple
      update_interval: 86400
  - rule_set:
