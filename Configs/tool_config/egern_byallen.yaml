  - rule_set:
      name: GitHub
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Github.yaml
      policy: GitHub
      update_interval: 86400
  # Docker 与 Loon/Surge 使用同一份 Blackmatrix 规则内容，内联避免失效远程源。
  - domain:
      name: Docker CloudFront 1
      match: d1q6f0aelx0por.cloudfront.net
      policy: Docker
  - domain:
      name: Docker CloudFront 2
      match: d2wy8f7a9ursnm.cloudfront.net
      policy: Docker
  - domain:
