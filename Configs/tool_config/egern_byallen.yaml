      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Proxy.yaml
      policy: Proxy
      update_interval: 86400
  - rule_set:
      name: 国内 IP
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/ChinaIP.yaml
      policy: DIRECT
      update_interval: 86400
  - geoip:
      name: GeoIP 中国
      match: CN
      policy: DIRECT
      no_resolve: true
  - default:
      name: 最终规则
      policy: Final

# 新增订阅和手写节点时，默认加入以下策略组。
default_subscription_group: 拼好鸡
default_proxy_group: Proxy

# Loon SkipProxy 的安全功能已通过 bypass_tunnel_proxy 对齐。
# MITM、破解/响应脚本、重写、小组件与模块不迁移，以 Surge 的无活动脚本基线为准。
