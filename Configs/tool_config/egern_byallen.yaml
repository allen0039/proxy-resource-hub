      policy: TikTok
      update_interval: 86400

  # 5. 具体媒体服务优先于 CDN、通用媒体和购物规则。
  - rule_set:
      name: Emby
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Emby.yaml
      policy: Emby
      update_interval: 86400
  - rule_set:
      name: Netflix
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Netflix.yaml
      policy: Netflix
      update_interval: 86400
  - rule_set:
      name: Disney
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Disney.yaml
