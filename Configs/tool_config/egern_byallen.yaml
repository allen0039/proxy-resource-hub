      policy: DIRECT
      update_interval: 86400
  - rule_set:
      name: 个人域名
      match: https://raw.githubusercontent.com/allen0039/proxy-resource-hub/main/Rules/Egern/Personal/Domain.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      name: PT 站点
      match: https://raw.githubusercontent.com/allen0039/proxy-resource-hub/main/Rules/Egern/PT/Domain.yaml
      policy: DIRECT
      update_interval: 86400

  # 3. 局域网、系统服务与拦截。
  - rule_set:
      name: 局域网
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Lan.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      name: Apple Push
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/APNs.yaml
