  - domain_suffix:
      name: Docker 官网
      match: docker.com
      policy: Docker
  - domain_suffix:
      name: Docker Registry
      match: docker.io
      policy: Docker
  - domain_suffix:
      name: Docker Hub
      match: dockerhub.com
      policy: Docker
  - rule_set:
      name: Telegram
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Telegram.yaml
      policy: Telegram
      update_interval: 86400
  - rule_set:
      name: X
