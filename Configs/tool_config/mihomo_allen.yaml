# 全局配置
global-ua: clash.meta
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
profile:
  store-selected: true
  store-fake-ip: true

# 控制面板：external-ui 路径需与运行环境一致。
external-controller: 0.0.0.0:9090 # API 控制地址
secret: CHANGE_ME
external-ui: ui # 面板存放路径（通常在内核执行目录下的 ui 文件夹）
external-ui-name: zashboard # 面板名称（对应你下载的这个压缩包）
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip" # 面板下载地址

# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP: {ports: [80, 8080-8880], override-destination: true}
    TLS: {ports: [443, 8443]}
    QUIC: {ports: [443, 8443]}
  skip-domain:
    - "+.baidu.com"
    - 'Mijia Cloud'
    - '+.push.apple.com'
    - '+.wechat.com'
    - '+.qpic.cn'
    - '+.qq.com'
    - '+.wechatapp.com'
    - '+.apple.com'
    - '+.oray.com'
    - '+.sunlogin.net'
    - '+.vivox.com'

# TUN
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  use-system-hosts: true
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.localhost'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - '+.push.apple.com'
    - '+.wechat.com'
    - '+.qpic.cn'
    - '+.qq.com'
    - '+.wechatapp.com'
    - 'time.*.com'
    - 'ntp.*.com'
    - '*.m-team.cc'
    - 'stun.*.*'
    - 'stun.*.*.*'
    - 'stun.*.*.*.*'
    - 'stun.*.*.*.*.*'
    - 'lens.l.google.com'
    - 'stun.l.google.com'
  respect-rules: true
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver: [https://223.5.5.5/dns-query, https://doh.pub/dns-query]
  direct-nameserver: [https://223.5.5.5/dns-query, https://doh.pub/dns-query]
  nameserver: [https://dns.google/dns-query, https://dns.cloudflare.com/dns-query]

