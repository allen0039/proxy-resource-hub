## 订阅提供商：节点先在这里汇总，再由“全部节点”统一引用
proxy-providers:
  拼好鸡:
    url: "获取到的订阅链接"
    type: http
    interval: 21600
    filter: ^(?!.*(拒绝|直连|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|traffic))
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 900
    proxy: DIRECT
  机场:
    url: "获取到的订阅链接"
    type: http
    interval: 21600
    filter: ^(?!.*(拒绝|直连|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|套餐到期|流量重置|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|traffic|Traffic|Expire|Reset))
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 300
    proxy: DIRECT
## 本地固定出口，不参与地区节点策略组
proxies:
  - name: Tailscale
    type: tailscale
    hostname: mihomo-openwrt
    state-dir: ./tailscale-mihomo
    ephemeral: false
    udp: true
    accept-routes: true
    ip-version: ipv4-prefer
    auth-key: CHANGE_ME
global-ua: clash.meta
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: '*'
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
profile:
  store-selected: true
  store-fake-ip: true
external-controller: 0.0.0.0:9090
secret: CHANGE_ME
external-ui: ui
external-ui-name: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - +.baidu.com
    - Mijia Cloud
    - +.push.apple.com
    - +.wechat.com
    - +.qpic.cn
    - +.qq.com
    - +.wechatapp.com
    - +.apple.com
    - +.oray.com
    - +.sunlogin.net
    - +.vivox.com
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  use-system-hosts: true
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
    - +.localhost
    - +.ts.net
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.push.apple.com
    - +.wechat.com
    - +.qpic.cn
    - +.qq.com
    - +.wechatapp.com
    - time.*.com
    - ntp.*.com
    - '*.m-team.cc'
    - stun.*.*
    - stun.*.*.*
    - stun.*.*.*.*
    - stun.*.*.*.*.*
    - lens.l.google.com
    - stun.l.google.com
  respect-rules: false
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  proxy-server-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  direct-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  direct-nameserver-follow-policy: true
  nameserver:
    - 223.5.5.5
    - 223.6.6.6
  nameserver-policy:
    +.ts.net: ts://Tailscale
    +.lan: system
    +.local: system
    router.asus.com: system
    www.miwifi.com: system
    miwifi.com: system
    router.synology.com: system
    tplogin.cn: system
    melogin.cn: system
    falogin.cn: system
    tplinklogin.net: system
    orbilogin.com: system
    routerlogin.net: system
    injections.adguard.org: system
    local.adguard.org: system
    +.bogon: system
