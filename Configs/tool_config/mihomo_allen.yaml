# Allen 维护 - Mihomo 配置

# 为兼容订阅转换工具，本文件不使用 YAML 合并锚点。

# 代理订阅
# 订阅使用说明：
# 1. proxy-providers 下每个名称对应一份订阅，请将 url 替换为自己的订阅地址。
# 2. 当前仅启用 拼好鸡；filter 筛选节点名称，health-check 检测节点可用性。
# 3. interval: 21600 表示每 6 小时更新；proxy 仅指定订阅下载出口；未设置 skip-cert-verify，默认校验证书。
proxy-providers:
  拼好鸡:
    url: "获取到的订阅链接"
    type: http
    interval: 21600
    filter: '^(?!.*(拒绝|直连|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|traffic))'
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 900
    proxy: DIRECT
#  机场:
#    url: "获取到的订阅链接"
#    type: http
#    interval: 21600
#    filter: '^(?!.*(拒绝|直连|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|traffic))'
#    health-check:
#      enable: true
#      url: http://cp.cloudflare.com/generate_204
#      interval: 300
#    proxy: DIRECT
#  自建:
#    url: "获取到的订阅链接"
#    type: http
#    interval: 21600
#    health-check:
#      enable: true
#      url: http://cp.cloudflare.com/generate_204
#      interval: 300
#    proxy: DIRECT
#  备用:
#    url: "获取到的订阅链接"
#    type: http
#    interval: 21600
#    health-check:
#      enable: true
#      url: http://cp.cloudflare.com/generate_204
#      interval: 300
#    proxy: DIRECT

# 全局配置
global-ua: clash.meta
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
profile:
  store-selected: true
  store-fake-ip: true

# 控制面板：external-ui 路径需与运行环境一致。
external-controller: 0.0.0.0:9090 # API 控制地址
secret: CHANGE_ME
external-ui: ui # 面板存放路径（通常在内核执行目录下的 ui 文件夹）
external-ui-name: zashboard # 面板名称（对应你下载的这个压缩包）
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip" # 面板下载地址

# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP: {ports: [80, 8080-8880], override-destination: true}
    TLS: {ports: [443, 8443]}
    QUIC: {ports: [443, 8443]}
  skip-domain:
    - "+.baidu.com"
    - 'Mijia Cloud'
    - '+.push.apple.com'
    - '+.wechat.com'
    - '+.qpic.cn'
    - '+.qq.com'
    - '+.wechatapp.com'
    - '+.apple.com'
    - '+.oray.com'
    - '+.sunlogin.net'
    - '+.vivox.com'

# TUN
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  use-system-hosts: true
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.localhost'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - '+.push.apple.com'
    - '+.wechat.com'
    - '+.qpic.cn'
    - '+.qq.com'
    - '+.wechatapp.com'
    - 'time.*.com'
    - 'ntp.*.com'
    - '*.m-team.cc'
    - 'stun.*.*'
    - 'stun.*.*.*'
    - 'stun.*.*.*.*'
    - 'stun.*.*.*.*.*'
    - 'lens.l.google.com'
    - 'stun.l.google.com'
  # 公共域名、直连目标和节点入口统一使用两台阿里传统 DNS。
  respect-rules: false
  default-nameserver: [223.5.5.5, 223.6.6.6]
  proxy-server-nameserver: [223.5.5.5, 223.6.6.6]
  direct-nameserver: [223.5.5.5, 223.6.6.6]
  direct-nameserver-follow-policy: true
  nameserver: [223.5.5.5, 223.6.6.6]
  # 局域网/路由器域名交回系统，避免向公网解析器查询。
  nameserver-policy:
    '+.lan': system
    '+.local': system
    'router.asus.com': system
    'www.miwifi.com': system
    'miwifi.com': system
    'router.synology.com': system
    'tplogin.cn': system
    'melogin.cn': system
    'falogin.cn': system
    'tplinklogin.net': system
    'orbilogin.com': system
    'routerlogin.net': system
    'injections.adguard.org': system
    'local.adguard.org': system
    '+.bogon': system

# === 静态单节点链式代理脱敏模板（仅注释示例，请勿直接启用） ===
# 使用方法：填写真实参数后，取消“中转节点”和一种“落地节点”的注释。
# AnyTLS 与 VLESS Reality 落地模板二选一，不能同时启用同名节点。
# dialer-proxy 的值必须与中转节点 name 完全一致。
# 链路：本机 -> 线路中转 -> 线路中转落地
#
# proxies:
#   # 中转入口：VLESS Reality 示例
#   - name: 线路中转
#     type: vless
#     server: <TRANSIT_SERVER>
#     port: <TRANSIT_PORT>
#     uuid: <TRANSIT_UUID>
#     udp: true
#     tls: true
#     skip-cert-verify: false
#     servername: <TRANSIT_SERVERNAME>
#     network: tcp
#     reality-opts:
#       public-key: <TRANSIT_PUBLIC_KEY>
#       short-id: <TRANSIT_SHORT_ID>
#     flow: xtls-rprx-vision
#     client-fingerprint: chrome
#
#   # 落地写法一：AnyTLS（与下面的 VLESS Reality 落地二选一）
#   - name: 线路中转落地
#     type: anytls
#     server: <LANDING_ANYTLS_SERVER>
#     port: <LANDING_ANYTLS_PORT>
#     password: <LANDING_ANYTLS_PASSWORD>
#     udp: true
#     tls: true
#     skip-cert-verify: false
#     sni: <LANDING_ANYTLS_SNI>
#     network: tcp
#     tls-fingerprint: <LANDING_ANYTLS_TLS_FINGERPRINT>
#     dialer-proxy: 线路中转
#
#   # 落地写法二：VLESS Reality（与上面的 AnyTLS 落地二选一）
#   - name: 线路中转落地
#     type: vless
#     server: <LANDING_VLESS_SERVER>
#     port: <LANDING_VLESS_PORT>
#     uuid: <LANDING_VLESS_UUID>
#     udp: true
#     tls: true
#     skip-cert-verify: false
#     servername: <LANDING_VLESS_SERVERNAME>
#     network: tcp
#     reality-opts:
#       public-key: <LANDING_VLESS_PUBLIC_KEY>
#       short-id: <LANDING_VLESS_SHORT_ID>
#     flow: xtls-rprx-vision
#     client-fingerprint: chrome
#     dialer-proxy: 线路中转

