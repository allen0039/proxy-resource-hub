rules:
  # === 本地自定义规则 ===
  # - IP-CIDR,123.123.123.1/32,美国节点,no-resolve
  # 1. 局域网与管理规则 (最高优先级)
  # 使用内置 DIRECT，不经过可切换策略组，确保下载器流量不会进入代理。
  - SRC-IP-CIDR,192.168.50.150/32,DIRECT
  - SRC-IP-CIDR,192.168.50.151/32,DIRECT
  - SRC-IP-CIDR,192.168.50.152/32,DIRECT
  - RULE-SET,custom_direct,DIRECT
  - RULE-SET,custom_hk,香港节点
  - RULE-SET,custom_us,美国节点
  - RULE-SET,custom_jp,日本节点
  - RULE-SET,custom_sg,新加坡节点

  # 2. Apple 与系统服务
  - DOMAIN-SUFFIX,apple-relay.apple.com,Apple

  # 3. 直连与 PT 服务
  # 已纳入远程 PT 订阅的站点不在本地重复维护；本节固定使用内置直连。
  # 字节跳动国内资源优先直连，覆盖后续 TikTok 等通用规则集。

  # 4. 技术开发与工具
  - DOMAIN-SUFFIX,github.io,GitHub
  - DOMAIN-SUFFIX,githubassets.com,GitHub
  - DOMAIN,api.github.com,GitHub
  # - DOMAIN-SUFFIX,githubusercontent.com,GitHub
  # - DOMAIN-SUFFIX,cloudflare.com,CDN

  # 5. AI 与媒体服务
  - DOMAIN-SUFFIX,mfallen.de,DIRECT
  # Google APIs 交由后面的 ai 与 google_domain 规则集分流，避免绕过 Google 策略组。
  - DOMAIN-SUFFIX,ytimg.com,YouTube
  # Google 图片资源优先交给 YouTube，覆盖后续通用 CDN 规则集。
  # - DOMAIN-SUFFIX,googleusercontent.com,Google
  # - DOMAIN-SUFFIX,gstatic.com,Google
  # - DOMAIN-KEYWORD,googleapis,Google
  - DOMAIN-SUFFIX,safebrowsing.google.com,Google

  # 6. 特殊站点与区域分流

  # 7. 拦截与修正规则
  # 精确放行必须位于 adobe.io 后缀拒绝规则之前。
  - DOMAIN,lcs-cops.adobe.io,DIRECT
  - DOMAIN-SUFFIX,ic.adobe.io,REJECT
  - DOMAIN-SUFFIX,hstatic.io,REJECT
  - DOMAIN-SUFFIX,adobestats.io,REJECT
  - DOMAIN-SUFFIX,adobe.io,REJECT
  - DOMAIN,ntb.lanjie100.com,REJECT
  - DOMAIN,msmp.abchina.com.cn,REJECT

  # 8. 游戏与远程规则集
  # 游戏分流 (MetaCubeX)
  - RULE-SET,steam_cn_domain,DIRECT
  - RULE-SET,steamcdn_domain,DIRECT
  - RULE-SET,steamcdn_ip,DIRECT,no-resolve
  - RULE-SET,games_domain,游戏平台
  # 其它远程规则集
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,wechat_domain,DIRECT
  - RULE-SET,wechat_asn,DIRECT,no-resolve
  - RULE-SET,bank_cn_domain,DIRECT
  - RULE-SET,china_telecom,DIRECT
  - RULE-SET,ai_cn_domain,DIRECT
  - RULE-SET,alibaba_domain,DIRECT
  - RULE-SET,aliyun_domain,DIRECT
  - RULE-SET,tencent_domain,DIRECT
  - RULE-SET,xiaomi_domain,DIRECT
  - RULE-SET,115_domain,DIRECT
  - RULE-SET,pt_domain,DIRECT
  - RULE-SET,pt_cn_domain,DIRECT
  - RULE-SET,public-tracker_domain,DIRECT
  - RULE-SET,apple_cn_domain,DIRECT
  - RULE-SET,apple_domain,Apple
  - RULE-SET,direct-ai,DIRECT
  - RULE-SET,personal_domain,DIRECT
  - RULE-SET,ai_priority,AI
  - RULE-SET,docker,Docker
  - RULE-SET,Cloudflare_domain,CDN
  - RULE-SET,ai,AI
  - RULE-SET,github_domain,GitHub
  - RULE-SET,gitbook_domain,GitHub
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - RULE-SET,onedrive_domain,OneDrive
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,tiktok_domain,TikTok
  - RULE-SET,speedtest_domain,测速
  - RULE-SET,telegram_domain,Telegram
  # X/Twitter 与 Meta 社交服务统一分流，Telegram 不在此组。
  - RULE-SET,twitter_domain,国外社交
  - RULE-SET,facebook_domain,国外社交
  - RULE-SET,instagram_domain,国外社交
  - RULE-SET,threads_domain,国外社交
  - RULE-SET,whatsapp_domain,国外社交
  - RULE-SET,netflix_domain,Netflix
  - RULE-SET,disney_domain,迪士尼+
  - RULE-SET,hbo_domain,HBO
  - RULE-SET,bahamut_domain,巴哈姆特
  - RULE-SET,paypal_domain,PayPal
  - RULE-SET,spotify_domain,Spotify
  - RULE-SET,emby_domain,Emby
  - RULE-SET,emby_ip,Emby,no-resolve
  - RULE-SET,biliintl_domain,哔哩哔哩
  - RULE-SET,cn_media_domain,国内媒体
  # 特殊媒体先于通用 CDN 和国外媒体匹配，避免被宽泛规则提前接管。
  - RULE-SET,porn_domain,特殊媒体
  - RULE-SET,cdn_domain,CDN
  - RULE-SET,cdn_skk,CDN
  - RULE-SET,global_media_domain,国外媒体
  # 国外媒体先于海淘匹配，避免 Amazon Prime Video 被购物规则接管。
  - RULE-SET,shopping_domain,海淘
  - RULE-SET,geolocation-!cn,Proxy
  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,netflix_ip,Netflix,no-resolve
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,cn_ip,DIRECT
  - MATCH,Final

